[build-system]
requires = [
  "setuptools>=59,<69; python_version<'3.8'",
  "setuptools>=59; python_version>='3.8'",
  "wheel<0.42; python_version<'3.8'",
  "wheel; python_version>='3.8'",
]
build-backend = "setuptools.build_meta"

[tool.mypy]
files = ["talon", "tests", "train.py"]
strict = true

[[tool.mypy.overrides]]
# These ML dependencies do not ship type information.
module = ["joblib.*", "sklearn.*"]
ignore_missing_imports = true
